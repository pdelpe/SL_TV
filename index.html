<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sri Lanka Live TV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
    }
    #app {
      display: flex;
      width: 100vw;
      height: 100vh;
    }
    #sidebar {
      width: 280px;
      background-color: #1c1c1e;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #2c2c2e;
      flex-shrink: 0;
      height: 100%;
    }
    .sidebar-header {
      padding: 18px 16px;
      border-bottom: 1px solid #2c2c2e;
    }
    .sidebar-header h2 {
      font-size: 1.1rem;
      color: #0a84ff;
    }
    .sidebar-header p {
      font-size: 0.8rem;
      color: #8e8e93;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .channel-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .channel-btn {
      background-color: #2c2c2e;
      color: #ffffff;
      border: 1px solid #3a3a3c;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .channel-btn:active, .channel-btn.active {
      background-color: #0a84ff;
      border-color: #0a84ff;
      font-weight: 600;
    }
    #player-container {
      flex: 1;
      height: 100%;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: #000000;
    }
  </style>
</head>
<body>

  <div id="app">
    <div id="sidebar">
      <div class="sidebar-header">
        <h2>Live TV</h2>
        <p id="current-channel">Select a channel</p>
      </div>
      <div class="channel-list" id="buttons-list"></div>
    </div>

    <div id="player-container">
      <video id="video-player" controls playsinline autoplay></video>
    </div>
  </div>

  <script>
    const streams = [
      { name: "Charana TV", url: "https://str001.peotv.lk/ndrm/live/charana/master.m3u8" },
      { name: "Sirasa TV", url: "https://str001.peotv.lk/ndrm/live/sirasa/master.m3u8" },
      { name: "TV Derana", url: "https://str001.peotv.lk/ndrm/live/derana/master.m3u8" },
      { name: "Hiru TV", url: "https://str001.peotv.lk/ndrm/live/hiru/master.m3u8" },
      { name: "Siyatha TV", url: "https://str001.peotv.lk/ndrm/live/siyatha/master.m3u8" },
      { name: "Swarnavahini", url: "https://str001.peotv.lk/ndrm/live/swarnawahini/master.m3u8" },
      { name: "ITN", url: "https://str001.peotv.lk/ndrm/live/itn/master.m3u8" },
      { name: "Rupavahini", url: "https://str001.peotv.lk/ndrm/live/rupavahini/master.m3u8" },
      { name: "Supreme TV", url: "https://str001.peotv.lk/ndrm/live/tv-supreme/master.m3u8" },
      { name: "Event TV", url: "https://str001.peotv.lk/ndrm/live/event-tv/master.m3u8" },
      { name: "Ada Derana 24", url: "https://str001.peotv.lk/ndrm/live/ada-derana-24/master.m3u8" },
      { name: "Vasantham TV", url: "https://str001.peotv.lk/ndrm/live/vasantham/master.m3u8" },
      { name: "Shakthi TV", url: "https://str001.peotv.lk/ndrm/live/shakthi/master.m3u8" },
      { name: "The Buddhist", url: "https://str001.peotv.lk/ndrm/live/buddhist/master.m3u8" },
      { name: "Shraddha TV", url: "https://str001.peotv.lk/ndrm/live/shraddha/master.m3u8" },
      { name: "Verbum TV", url: "https://str001.peotv.lk/ndrm/live/verbum/master.m3u8" }
    ];

    const video = document.getElementById('video-player');
    const buttonsList = document.getElementById('buttons-list');
    const currentTitle = document.getElementById('current-channel');
    let hls = null;

    function playStream(url, name, buttonElement) {
      document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
      if (buttonElement) buttonElement.classList.add('active');
      currentTitle.textContent = "Playing: " + name;

      if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play().catch(e => console.log("Playback error:", e));
      } else if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          video.play().catch(e => console.log("Autoplay blocked:", e));
        });
      }
    }

    streams.forEach((stream, index) => {
      const btn = document.createElement('button');
      btn.className = 'channel-btn';
      btn.textContent = stream.name;
      btn.onclick = () => playStream(stream.url, stream.name, btn);
      buttonsList.appendChild(btn);

      if (index === 0) {
        btn.classList.add('active');
        playStream(stream.url, stream.name, btn);
      }
    });
  </script>

</body>
</html>
