<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sri Lanka Live TV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      position: relative;
    }

    #player-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 100px; /* Space reserved for the 2-row channel grid */
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: #000000;
    }

    #current-channel {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.7);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #ffffff;
      pointer-events: none;
      z-index: 10;
    }

    /* Fixed grid layout to compress all 12 buttons onto the screen */
    #bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 100px; 
      background-color: #1c1c1e;
      display: grid;
      grid-template-columns: repeat(6, 1fr); /* 6 columns */
      grid-template-rows: repeat(2, 1fr);    /* 2 rows */
      gap: 6px;
      padding: 8px 12px;
      border-top: 1px solid #2c2c2e;
      z-index: 100;
    }

    .channel-btn {
      background-color: #2c2c2e;
      color: #ffffff;
      border: 1px solid #3a3a3c;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis; /* Adds '...' if a name is too long for the button */
      transition: background-color 0.15s ease, border-color 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .channel-btn:active, .channel-btn.active {
      background-color: #0a84ff;
      border-color: #0a84ff;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div id="player-container">
    <div id="current-channel">Select a channel</div>
    <video id="video-player" controls playsinline autoplay></video>
  </div>

  <div id="bottom-bar"></div>

  <script>
    // Reduced to 12 channels
    const streams = [
      { name: "Charana TV", url: "https://str001.peotv.lk/ndrm/live/charana/master.m3u8" },
      { name: "Sirasa TV", url: "https://str001.peotv.lk/ndrm/live/sirasa/master.m3u8" },
      { name: "TV Derana", url: "https://str001.peotv.lk/ndrm/live/derana/master.m3u8" },
      { name: "Hiru TV", url: "https://str001.peotv.lk/ndrm/live/hiru/master.m3u8" },
      { name: "Siyatha TV", url: "https://str001.peotv.lk/ndrm/live/siyatha/master.m3u8" },
      { name: "Swarnavahini", url: "https://str001.peotv.lk/ndrm/live/swarnawahini/master.m3u8" },
      { name: "ITN", url: "https://str001.peotv.lk/ndrm/live/itn/master.m3u8" },
      { name: "Rupavahini", url: "https://str001.peotv.lk/ndrm/live/rupavahini/master.m3u8" },
      { name: "Supreme TV", url: "https://str001.peotv.lk/ndrm/live/tv-supreme/master.m3u8" },
      { name: "Event TV", url: "https://str001.peotv.lk/ndrm/live/event-tv/master.m3u8" },
      { name: "Ada Derana 24", url: "https://str001.peotv.lk/ndrm/live/ada-derana-24/master.m3u8" },
      { name: "The Buddhist", url: "https://str001.peotv.lk/ndrm/live/buddhist/master.m3u8" }
    ];

    const video = document.getElementById('video-player');
    const bottomBar = document.getElementById('bottom-bar');
    const currentTitle = document.getElementById('current-channel');
    let hls = null;

    function playStream(url, name, buttonElement) {
      document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
      if (buttonElement) buttonElement.classList.add('active');
      
      currentTitle.textContent = "Playing: " + name;

      if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play().catch(e => console.log("Playback error:", e));
      } else if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          video.play().catch(e => console.log("Autoplay blocked:", e));
        });
      }
    }

    streams.forEach((stream, index) => {
      const btn = document.createElement('button');
      btn.className = 'channel-btn';
      btn.textContent = stream.name;
      btn.onclick = () => playStream(stream.url, stream.name, btn);
      
      bottomBar.appendChild(btn);

      if (index === 0) {
        btn.classList.add('active');
        playStream(stream.url, stream.name, btn);
      }
    });
  </script>

</body>
</html>
